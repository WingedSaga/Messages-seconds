<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сообщения секунды</title><meta name="theme-color" content="#eaf8e8"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#183322;background:#f7fcf7}button,input{font:inherit;border:0}button{cursor:pointer}.app{height:100dvh;min-height:530px;max-width:1200px;margin:auto;display:grid;grid-template-columns:350px 1fr;background:white;box-shadow:0 20px 70px #4a85631f;overflow:hidden}.side{padding:24px 14px 14px;border-right:1px solid #dcecdf;display:flex;flex-direction:column;background:#fcfffc}.brand{display:flex;gap:10px;align-items:center;color:#62926c;font-size:14px;line-height:15px;padding:0 10px 28px}.brand b{font-size:17px;color:#1c4a2a}.mark{width:34px;height:34px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#70d78c,#38a963);font-size:26px;font-weight:bold;color:white}.title{display:flex;justify-content:space-between;align-items:center;padding:0 10px 15px}.title h1{margin:0;font-size:25px}.plus{width:34px;height:34px;border-radius:50%;background:#dff4e2;color:#319553;font-size:25px}.search{margin:0 4px 13px;height:42px;border:1px solid #e2eee4;border-radius:13px;padding:0 12px;background:#f5faf5;display:flex;align-items:center;gap:8px;color:#89a58e}.search input{background:transparent;outline:none;width:100%;color:#183322}.list{overflow:auto;flex:1}.chat{width:100%;padding:10px;display:flex;gap:11px;align-items:center;border-radius:14px;background:transparent;text-align:left;color:#183322}.chat:hover,.chat.active{background:#e6f7e8}.av{flex:0 0 auto;width:45px;height:45px;display:grid;place-items:center;border-radius:16px;background:#b9e9bf;font-weight:bold;font-size:18px;color:#31533b;position:relative}.on{position:absolute;width:11px;height:11px;border-radius:50%;background:#51c878;border:2px solid white;right:-1px;bottom:0}.copy{width:100%;min-width:0}.line{display:flex;justify-content:space-between;gap:7px;align-items:center}.line b{font-size:15px}.line time,.preview{font-size:12px;color:#899f8d}.preview{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{background:#5cc57a;color:#fff;border-radius:10px;padding:2px 6px;font-size:10px;font-style:normal}.me{display:flex;align-items:center;gap:10px;padding:9px;background:#f3faf4;border-radius:14px}.me .av{width:37px;height:37px;background:#bce7c5}.me b,.me small{display:block}.me small{color:#6f9277;font-size:11px}.talk{display:flex;min-width:0;flex-direction:column;background:radial-gradient(circle at 70% 20%,#f5fff4,transparent 35%),#fff}.head{height:80px;padding:0 28px;border-bottom:1px solid #dcecdf;display:flex;align-items:center;justify-content:space-between}.person{display:flex;gap:11px;align-items:center}.person b,.person small{display:block}.person small{color:#65ad77;font-size:12px;margin-top:3px}.actions button,.composer button{height:38px;width:38px;border-radius:12px;background:#f1f8f2;color:#579c69;font-size:18px;margin-left:5px}.messages{flex:1;overflow:auto;padding:26px clamp(18px,6vw,76px);display:flex;flex-direction:column;gap:10px}.date{align-self:center;background:#f1f7f1;color:#8ba590;border-radius:12px;padding:5px 11px;font-size:11px;margin-bottom:12px}.row{display:flex}.row.mine{justify-content:flex-end}.bubble{max-width:86%;background:#f3f7f3;padding:11px 14px 7px;border-radius:5px 17px 17px 17px;font-size:15px;line-height:1.4}.mine .bubble{background:#c8efce;border-radius:17px 5px 17px 17px}.bubble time{display:block;text-align:right;color:#76a17f;font-size:10px;margin-top:3px}.typing{font-size:12px;color:#7b987f;margin:8px 3px}.composer{min-height:76px;padding:14px 28px;border-top:1px solid #dcecdf;display:flex;align-items:center;gap:8px}.composer button{margin:0}.composer input{height:45px;flex:1;min-width:0;border-radius:14px;background:#f5faf5;outline:none;padding:0 15px}.composer .send{background:#59bf75;color:#fff}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#193824;color:#fff;padding:12px 17px;border-radius:14px;font-size:14px;display:none}.toast.show{display:block}.modal{position:fixed;inset:0;background:#18332238;display:none;place-items:center;padding:18px}.modal.show{display:grid}.card{max-width:350px;width:100%;padding:28px;border-radius:24px;background:white;text-align:center;position:relative}.card h2{margin:14px 0 7px}.card p{font-size:13px;color:#708b76}.card input,.card button{width:100%;height:44px;border-radius:12px;margin-top:10px;padding:0 12px}.card input{border:1px solid #dcecdf}.card button{background:#55bc72;color:white;font-weight:bold}.x{position:absolute!important;right:12px;top:8px;width:35px!important;background:transparent!important;color:#8ba28f!important;font-size:25px}@media(max-width:720px){.app{grid-template-columns:85px 1fr}.side{padding:18px 8px 10px}.brand span:last-child,.title h1,.search,.copy,.me span:not(.av){display:none}.brand{justify-content:center;padding:0 0 24px}.title{justify-content:center;padding-bottom:16px}.chat{justify-content:center;padding:8px 3px}.me{justify-content:center;padding:8px 3px}.head{padding:0 12px}.actions button{width:33px;height:33px}.messages{padding:20px 15px}.composer{padding:11px 12px;gap:5px}.composer input{height:40px}.composer button{height:36px;width:36px}}
</style></head><body><main class="app"><aside class="side"><div class="brand"><span class="mark">⌁</span><span>Сообщения<br><b>секунды</b></span></div><div class="title"><h1>Чаты</h1><button class="plus" onclick="openNew()">＋</button></div><label class="search">⌕ <input id="search" placeholder="Поиск" oninput="filterChats()"></label><div class="list" id="list"></div><div class="me"><span class="av">В</span><span><b>Влад</b><small>В сети</small></span></div></aside><section class="talk"><header class="head"><div class="person"><span class="av" id="mainAv">А<span class="on"></span></span><span><b id="mainName">Аня</b><small id="status">в сети</small></span></div><div class="actions"><button onclick="toast('Звонок начинается…')">☎</button><button onclick="toast('Видеозвонок начинается…')">▣</button><button onclick="toast('Открыты сведения о чате')">ⓘ</button></div></header><div class="messages" id="messages"><div class="date">Сегодня</div></div><form class="composer" onsubmit="send(event)"><button type="button" onclick="toast('Выберите фото или файл')">＋</button><input id="text" placeholder="Напишите сообщение…"><button type="button" onclick="emoji()">☺</button><button class="send">➤</button></form></section></main><div class="toast" id="toast"></div><div class="modal" id="modal" onclick="closeNew()"><div class="card" onclick="event.stopPropagation()"><button class="x" onclick="closeNew()">×</button><div class="mark" style="margin:auto">✦</div><h2>Новый чат</h2><p>Введи имя друга, чтобы начать общение.</p><input placeholder="Имя или номер"><button onclick="closeNew();toast('Новый чат создан!')">Начать чат</button></div></div><script>
const chats=[['Аня','Встретимся после школы?','17:42','А','#b9e9bf',2,1],['Макс','Секунду, уже смотрю 👀','16:18','М','#c9e5ff',0,1],['Семья','Мама: Не забудь хлеб','15:01','С','#ffdcb8',4,0],['Игровая','Дима: Я создал комнату','вчера','🎮','#e6d4ff',0,0],['Лиза','Спасибо за фото!','вчера','Л','#ffe0ec',0,0]];let active=0;let messages=['Привет! Ты уже дома?','Да, только пришёл 😊','Супер! Встретимся после школы?'];function render(){let q=search.value.toLowerCase();list.innerHTML=chats.filter(c=>c[0].toLowerCase().includes(q)).map(c=>{let i=chats.indexOf(c);return '<button class="chat '+(i===active?'active':'')+'" onclick="choose('+i+')"><span class="av" style="background:'+c[4]+'">'+c[3]+(c[6]?'<i class="on"></i>':'')+'</span><span class="copy"><span class="line"><b>'+c[0]+'</b><time>'+c[2]+'</time></span><span class="line preview">'+c[1]+(c[5]?'<em class="count">'+c[5]+'</em>':'')+'</span></span></button>'}).join('');mainName.textContent=chats[active][0];mainAv.firstChild.nodeValue=chats[active][3];mainAv.style.background=chats[active][4];status.textContent=chats[active][6]?'в сети':'был(а) недавно';messagesEl()};function messagesEl(){messages.innerHTML='<div class="date">Сегодня</div>'+messages.map((m,i)=>'<div class="row '+(i===1||i>2?'mine':'')+'"><div class="bubble">'+m+'<time>'+('17:'+(35+i*2))+(i===1||i>2?' ✓✓':'')+'</time></div></div>').join('')+(active===0?'<div class="typing">● ● ● Аня печатает…</div>':'');messages.scrollTop=messages.scrollHeight}function choose(i){active=i;messages=['Привет! Это чат «'+chats[i][0]+'».'];render()}function filterChats(){render()}function send(e){e.preventDefault();let v=text.value.trim();if(!v)return;messages.push(v);text.value='';messagesEl()}function emoji(){text.value+=' 😊';text.focus()}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.className='toast show';setTimeout(()=>e.className='toast',2200)}function openNew(){modal.className='modal show'}function closeNew(){modal.className='modal'}render();
</script></body></html>
